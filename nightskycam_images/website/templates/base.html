<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nightskycam{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-sm border-bottom mb-4 site-navbar">
    <div class="container-xxl">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('pages.home') }}">
            <i class="bi bi-stars text-info"></i>
            <span>Nightskycam</span>
        </a>
        <ul class="navbar-nav flex-row gap-3">
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'pages.home' %}active{% endif %}"
                   href="{{ url_for('pages.home') }}"><i class="bi bi-speedometer2 me-1"></i>Stats</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint in ('pages.browse', 'pages.image_detail') %}active{% endif %}"
                   href="{{ url_for('pages.browse') }}"><i class="bi bi-images me-1"></i>Browse</a>
            </li>
            {% if config.SAIA_API_KEY or config.SAIA_CLIENT %}
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'pages.ask_page' %}active{% endif %}"
                   href="{{ url_for('pages.ask_page') }}"><i class="bi bi-chat-dots me-1"></i>Ask</a>
            </li>
            {% endif %}
        </ul>
    </div>
</nav>

<main class="container-xxl pb-5">
    {% block content %}{% endblock %}
</main>

<footer class="border-top py-3 text-secondary small">
    <div class="container-xxl d-flex justify-content-between">
        <span>nightskycam image database</span>
        <span>read-only mirror &middot; refreshed hourly</span>
    </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>

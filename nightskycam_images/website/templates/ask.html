{% extends "base.html" %}
{% block title %}Nightskycam — ask{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card mb-3">
            <div class="card-body">
                <h1 class="h5"><i class="bi bi-chat-dots me-2 text-info"></i>Ask the image database</h1>
                <p class="text-secondary small mb-2">
                    Describe what you want in plain language; an LLM translates it
                    into database queries and answers with text or images.
                </p>
                <div class="d-flex gap-2 flex-wrap">
                    <button type="button" class="btn btn-sm btn-outline-secondary example-prompt">show a rainy image from nightskycam5</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary example-prompt">clear nights on nightskycam8 last October</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary example-prompt">how many tiff images were taken in 2024?</button>
                </div>
            </div>
        </div>

        <div id="chat-log" class="chat-log vstack gap-3 mb-3"></div>

        <form id="ask-form" class="card">
            <div class="card-body d-flex gap-2 align-items-end p-2">
                <textarea id="ask-input" class="form-control" rows="2"
                          placeholder="e.g. show the clearest night of last month on nightskycam8"
                          required></textarea>
                <div class="vstack gap-1" style="width: auto;">
                    <button type="submit" id="ask-send" class="btn btn-info">
                        <span class="spinner-border spinner-border-sm d-none" id="ask-spinner"></span>
                        <i class="bi bi-send" id="ask-send-icon"></i>
                    </button>
                    <button type="button" id="ask-reset" class="btn btn-outline-secondary btn-sm" title="new conversation">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='ask.js') }}"></script>
{% endblock %}
